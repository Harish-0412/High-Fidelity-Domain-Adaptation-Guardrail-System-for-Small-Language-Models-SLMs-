services:
  fastapi-app:
    build:
      context: .
      # Assumes a Dockerfile exists at the root or within docker/ directory
      # dockerfile: docker/Dockerfile
    container_name: fastapi-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Bind mounts for persistent data sources and logs
      - ./data:/app/data
      - ./logs:/app/logs
    networks:
      - medical-intel-net
    depends_on:
      redis-cache:
        condition: service_healthy
      qdrant-vectordb:
        condition: service_healthy
      ollama-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  ollama-engine:
    image: ollama/ollama:latest
    container_name: ollama-engine
    restart: unless-stopped
    # Exposing to the host machine
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - medical-intel-net
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  qdrant-vectordb:
    image: qdrant/qdrant:v1.12.1
    container_name: qdrant-vectordb
    restart: unless-stopped
    # Exposing for local development access
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - medical-intel-net
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && echo -e \"GET /readyz HTTP/1.1\\r\\nhost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && cat <&3 | grep -q \"all shards are ready\"'"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-cache:
    image: redis:alpine
    container_name: redis-cache
    restart: unless-stopped
    # Exposing only internally within the Docker network
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    networks:
      - medical-intel-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  medical-intel-net:
    driver: bridge

volumes:
  ollama_models:
  qdrant_data:
  redis_data:
