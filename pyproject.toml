[project]
name = "domain-slm-guardrails"
version = "0.1.0"
description = "Generic domain retrieval core for guardrailed small language model systems."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
api = [
  "fastapi>=0.110.0",
  "uvicorn>=0.27.0",
]
retrieval = [
  "qdrant-client>=1.9.0",
  "sentence-transformers>=2.7.0",
  "PyYAML>=6.0.0",
  "PyMuPDF>=1.24.0",
]
dev = [
  "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
