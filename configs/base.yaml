embedding_model: local-hashing
production_embedding_model: BAAI/bge-large-en-v1.5
chunk_size_tokens: 256
chunk_overlap_tokens: 50
vector_store: qdrant
bm25_enabled: true
qdrant_url: http://localhost:6333
dense_vector_size: 384
critic_hallucination_threshold: 0.5
critic_checkpoint_path: outputs/critic/critic_model.pt

# LLM Configuration for Generation
llm:
  type: ollama  # Options: "ollama" or "hf"
  model: llama3.2  # For Ollama: llama3.2, mistral, phi3, etc. For HF: model name
  base_url: http://localhost:11434  # Ollama server URL
  temperature: 0.7
  max_tokens: 512
  # HF-specific settings (only used if type: "hf")
  device: auto  # auto, cuda, cpu


# LLM Configuration
llm:
  provider: ollama
  model: llama3.2
  base_url: http://localhost:11434
  temperature: 0.7
  max_tokens: 1024
  top_p: 0.9
  top_k: 40
  use_generation: true

